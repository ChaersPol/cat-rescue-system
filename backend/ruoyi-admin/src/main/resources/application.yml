# 项目相关配置
ruoyi:
  # 名称
  name: 宠物救助系统
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ./uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数
    # 原值 1000/800 是 RuoYi 默认值，对 2C1.7G 的线上机器过大：
    # 一旦依赖（MySQL/Redis）变慢，几百个线程会同时阻塞，把整机拖死（见 2026-10-30 事故）
    accept-count: 200
    threads:
      # tomcat最大线程数：本站并发为几十，100 线程足够
      max: 100
      # Tomcat启动初始化的线程数
      min-spare: 20

# 日志配置
logging:
  level:
    # debug 会把每条 SQL 及其参数写进日志（约 7MB/天），线上磁盘和 IO 都吃不消，
    # 默认降到 info，需要排查时再临时改回 debug
    com.ruoyi: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # JSON 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（视频素材需要更大上限）
      max-file-size: 50MB
      # 设置总上传的文件大小
      max-request-size: 100MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接/命令超时时间
      # Redis 在本机，正常响应是毫秒级；原 10s 太长，一旦机器卡顿，
      # 请求线程会长时间挂住并堆积。快速失败比长时间等待更安全
      timeout: 3s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # 连接池最大阻塞等待时间（负值表示没有限制，会让请求无限期排队）
          max-wait: 2000ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 上传文件清理（孤儿文件回收）
cat:
  file-clean:
    # 总开关，关闭后不再自动清理（页面上的「删除」仍会实时删文件）
    enabled: true
    # 宽限期（小时）：最近上传的文件不参与清理，防止刚传完还没点保存就被删
    grace-hours: 24
    # 每天凌晨 3:30 执行
    cron: "0 30 3 * * ?"

# 猫咪照片/视频缩略图配置
thumbnail:
  # 总开关，关闭后上传不再生成缩略图，列表直接展示原图
  enabled: true
  # 视频封面抽帧配置
  video:
    # 关闭后视频不生成封面，由前端用 video 首帧兜底展示
    enabled: true
  ffmpeg:
    # ffmpeg 可执行文件路径，未安装时留空即可（会自动跳过视频封面）
    # macOS: /opt/homebrew/bin/ffmpeg   Linux: /usr/bin/ffmpeg   Windows: ffmpeg.exe
    path: ffmpeg
    # 单次抽帧超时时间（秒）
    timeout: 20
